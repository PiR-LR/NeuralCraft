<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="nc-gradient" x1="20%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="nc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fond sombre arrondi moderne -->
  <rect width="128" height="128" rx="28" fill="#020617" />
  <rect width="128" height="128" rx="28" fill="url(#nc-glow)" />

  <!-- Lueur diffuse arrière -->
  <path
    d="M36 92 L36 36 L92 92 L92 36"
    stroke="url(#nc-gradient)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.3"
    filter="url(#neon-glow)"
  />

  <!-- Tracé principal du N NeuralCraft -->
  <path
    d="M36 92 L36 36 L92 92 L92 36"
    stroke="url(#nc-gradient)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Nœuds physiques aux 4 coins -->
  <circle cx="36" cy="92" r="7" fill="#020617" stroke="#34d399" stroke-width="3.5" />
  <circle cx="36" cy="36" r="7" fill="#020617" stroke="#34d399" stroke-width="3.5" />
  <circle cx="92" cy="92" r="7" fill="#020617" stroke="#22d3ee" stroke-width="3.5" />
  <circle cx="92" cy="36" r="7" fill="#020617" stroke="#22d3ee" stroke-width="3.5" />

  <!-- Cœur central vibrant -->
  <circle cx="64" cy="64" r="8" fill="#2dd4bf" opacity="0.4" filter="url(#neon-glow)" />
  <circle cx="64" cy="64" r="5" fill="#34d399" />
</svg>
